paths:
  /orders:
    post:
      summary: Create a new order
      operationId: createOrder
      tags:
        - Orders

      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique key to ensure idempotent order creation
          schema:
            type: string
            example: abc123

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              items:
                - productId: P1
                  quantity: 2
                - productId: P2
                  quantity: 1
              addressId: ADDR1

      responses:
        '201':
          description: Order successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              example:
                orderId: ORD-10001
                status: PENDING
                totalAmount: 150.00
                currency: USD

        '400':
          description: Invalid request

        '401':
          description: Unauthorized (Invalid or missing JWT)

        '409':
          description: Duplicate idempotency key

        '500':
          description: Internal server error

      security:
        - bearerAuth: []

  /orders/{id}/pay:
    post:
      summary: Pay for an order
      description: Processes payment for a specific order.
      operationId: payOrder
      tags:
        - Orders
      security:
        - bearerAuth: [ ]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique key to ensure idempotent order creation
          schema:
            type: string
            example: abc123
        - name: id
          in: path
          required: true
          description: Unique identifier of the order
          schema:
            type: string
      requestBody:
        #required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Payment processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '404':
          description: Order not found
        '409':
          description: Order already paid
        '500':
          description: Internal server error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    CreateOrderRequest:
      type: object
      required:
        - items
        - addressId
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemRequest'
        addressId:
          type: string
          example: ADDR1

    OrderItemRequest:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
          example: P1
        quantity:
          type: integer
          minimum: 1
          example: 2
        price:
          type: number
          format: decimal
          minimum: 0
          example: 19.99

    OrderResponse:
      type: object
      properties:
        orderId:
          type: string
          example: ORD-10001
        status:
          type: string
          example: PENDING
        totalAmount:
          type: number
          format: decimal
          example: 150.00
        currency:
          type: string
          example: USD
    PaymentRequest:
      type: object
      required:
        - paymentMethod
        - amount
        - currency
      properties:
        paymentMethod:
          type: string
          example: credit_card
        amount:
          type: number
          format: decimal
          example: 99.99
        currency:
          type: string
          example: USD
        cardDetails:
          type: object
          description: Required if paymentMethod is credit_card
          properties:
            cardNumber:
              type: string
              example: "4111111111111111"
            expiryMonth:
              type: integer
              example: 12
            expiryYear:
              type: integer
              example: 2028
            cvv:
              type: string
              example: "123"

    PaymentResponse:
      type: object
      properties:
        paymentId:
          type: string
        providerReference:
          type: string