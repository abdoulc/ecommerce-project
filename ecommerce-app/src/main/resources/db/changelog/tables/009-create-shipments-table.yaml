databaseChangeLog:
  - changeSet:
      id: 009-shipments-table
      author:  Abdoul Razak
      changes:
        - createTable:
            tableName: shipments
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
              - column:
                  name: order_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: tracking_number
                  type: VARCHAR(100)