databaseChangeLog:
  - changeSet:
      id: create-idempotency-table
      author: Abdoul Razak
      changes:
        - createTable:
            tableName: idempotency
            columns:
              - column:
                  name: id
                  type: CHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: idempotency_key
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: operation
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: request_hash
                  type: VARCHAR(255)
              - column:
                  name: response_payload
                  type: TEXT
              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: DATETIME(6)

        - addUniqueConstraint:
            tableName: idempotency
            columnNames: idempotency_key, operation
            constraintName: uk_idempotency_key_operation
