databaseChangeLog:
  - changeSet:
      id: 011-inventory-reservation-table
      author:  Abdoul Razak
      changes:
        - createTable:
            tableName: inventory_reservation
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: order_id
                  type: varchar(36)
                  constraints:
                    nullable: false

              - column:
                  name: product_id
                  type: varchar(36)
                  constraints:
                    nullable: false

              - column:
                  name: quantity
                  type: int
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false

              - column:
                  name: expiry_time
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP