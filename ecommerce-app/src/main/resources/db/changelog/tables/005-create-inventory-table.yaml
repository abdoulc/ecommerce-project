databaseChangeLog:
  - changeSet:
      id: 004-inventory-table
      author:  Abdoul Razak
      changes:
        - createTable:
            tableName: inventory
            columns:
              - column:
                    name: id
                    type: varchar(36)
                    constraints:
                      primaryKey: true
                      nullable: false
              - column:
                  name: product_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: available_quantity
                  type: INT
                  constraints:
                    nullable: false

              - column:
                    name: reserved_quantity
                    type: INT
                    defaultValueNumeric: 0
                    constraints:
                      nullable: false

              - column:
                    name: version
                    type: BIGINT
                    defaultValueNumeric: 0
                    constraints:
                      nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP