databaseChangeLog:
  - changeSet:
      id: 004-inventory-table
      author:  Abdoul Razak
      changes:
        - createTable:
            tableName: inventory
            columns:
              - column:
                  name: product_id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
              - column:
                  name: available_qty
                  type: INT
                  constraints:
                    nullable: false